name: NexJail
options:
  bundleIdPrefix: com.majedo67
  deploymentTarget:
    iOS: "16.0"
targets:
  NexJail:
    type: application
    platform: iOS
    sources:
      - NexJail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majedo67.nexjail
        PRODUCT_NAME: NexJail
        INFOPLIST_KEY_CFBundleDisplayName: NexJail
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
