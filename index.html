<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>NexJail IPA</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#14223a;--line:#2a4162;--muted:#9aabc5;--blue:#61d4ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#1c4772,transparent 48%),var(--bg);color:#f4f8ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}
.wrap{width:100%;max-width:520px}
header{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.12em;font-size:13px}
.icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#1b5b8b,#10233d);border:1px solid #39769b;color:#a9f2ff;font-size:25px}
.card{margin-top:28px;padding:26px 22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(155deg,#172741,#101a2b);text-align:center;box-shadow:0 20px 70px #0005}
.eyebrow{color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.2em}
h1{font-size:clamp(42px,10vw,60px);letter-spacing:-.06em;margin:10px 0}
p{color:var(--muted);line-height:1.6;font-size:14px}
button{width:100%;margin-top:18px;padding:16px;border-radius:14px;border:1px solid #40516a;background:#202d40;color:#9aabc5;font-size:16px;font-weight:900;cursor:not-allowed}
.note{margin-top:16px;padding:13px;border:1px solid #5a4a2b;background:#211d16;border-radius:13px;color:#e8d8b4;font-size:12px;line-height:1.55}
footer{text-align:center;color:#72839d;font-size:11px;margin-top:22px}
</style>
</head>
<body>
<main class="wrap">
<header><div class="icon">N</div><span>NEX PROJECTS</span></header>
<section class="card">
<div class="eyebrow">IPHONE APP DOWNLOAD</div>
<h1>NexJail<span style="color:var(--blue)">.</span></h1>
<p>Get the NexJail IPA for your iPhone.</p>
<button type="button" disabled>INSTALL IPA</button>
<div class="note"><strong>IPA not uploaded yet.</strong><br>The install button will become available when a real NexJail.ipa file is added to this project. This page does not create or sign an IPA.</div>
</section>
<footer>NEXJAIL · INDEPENDENT PROJECT</footer>
</main>
</body>
</html>
