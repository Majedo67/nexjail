name: Build NexJail IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          mkdir -p ios/NexJail/Assets.xcassets/AppIcon.appiconset
          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit
          import Foundation

          let size = 1024
          let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: size,
              pixelsHigh: size,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          )!
          NSGraphicsContext.saveGraphicsState()
          let context = NSGraphicsContext(bitmapImageRep: rep)!
          NSGraphicsContext.current = context
          context.imageInterpolation = .high

          NSColor(calibratedRed: 0.04, green: 0.10, blue: 0.18, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(x: 0, y: 0, width: size, height: size)).fill()

          let tile = NSBezierPath(roundedRect: NSRect(x: 30, y: 30, width: 964, height: 964), xRadius: 190, yRadius: 190)
          NSColor(calibratedRed: 0.08, green: 0.28, blue: 0.44, alpha: 1).setFill()
          tile.fill()
          NSColor(calibratedRed: 0.38, green: 0.83, blue: 1, alpha: 1).setStroke()
          tile.lineWidth = 20
          tile.stroke()

          let text = "N" as NSString
          let font = NSFont.systemFont(ofSize: 650, weight: .heavy)
          let attrs: [NSAttributedString.Key: Any] = [
              .font: font,
              .foregroundColor: NSColor(calibratedRed: 0.73, green: 0.96, blue: 1, alpha: 1)
          ]
          let textSize = text.size(withAttributes: attrs)
          text.draw(at: NSPoint(x: (CGFloat(size) - textSize.width) / 2, y: (CGFloat(size) - textSize.height) / 2 - 20), withAttributes: attrs)

          context.flushGraphics()
          NSGraphicsContext.restoreGraphicsState()
          let png = rep.representation(using: .png, properties: [:])!
          try png.write(to: URL(fileURLWithPath: "ios/NexJail/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          SWIFT
          swift /tmp/make_icon.swift
          cat > ios/NexJail/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild -project NexJail.xcodeproj \
            -scheme NexJail \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/NexJail.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          cd Payload/..
          zip -r NexJail-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexJail-unsigned-IPA
          path: NexJail-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
